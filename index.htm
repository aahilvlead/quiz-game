<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Orientation Quiz Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap');

  :root{
    --bg: #10131B;
    --surface: #1B2030;
    --surface-hi: #242B40;
    --gold: #E8B54B;
    --gold-dim: #8A6A28;
    --teal: #3FA796;
    --red: #D6584F;
    --text: #F0EEE6;
    --text-dim: #9BA0AF;
    --border: #2C3348;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 40px 20px 60px;
  }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  h1{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size: 28px;
    margin:0;
    letter-spacing: -0.5px;
  }

  h1 span{ color: var(--gold); }

  .stats{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pill{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .pill b{
    color: var(--text);
    font-family:'Poppins', sans-serif;
    font-size: 16px;
  }

  .pill.skipped b{ color: var(--red); }
  .pill.lifeline b{ color: var(--gold); }

  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .legend span{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .dot{
    width:9px; height:9px; border-radius:50%;
    display:inline-block;
  }

  .dot.answered{ background: var(--red); }
  .dot.unopened{ background: #FFFFFF; border: 1px solid #000000; }

  #grid{
    display:grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
  }

  @media (max-width: 720px){
    #grid{ grid-template-columns: repeat(5, 1fr); }
  }

  .box{
    position:relative;
    aspect-ratio: 1;
    background: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size: 18px;
    color: #000000;
    cursor:pointer;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    user-select:none;
  }

  .box:hover{
    transform: translateY(-3px);
    background: #F2F2F2;
    border-color: #000000;
  }

  .box.done,
  .box.skipped{
    background: var(--red);
    border-color: #000000;
    color: #FFFFFF;
    opacity: 1;
  }

  .lifeline-badge{
    position:absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    color: #2B1E05;
    font-size: 10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
  }

  #startOverlay{
    position: fixed;
    inset: 0;
    background: #0A0C12;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap: 20px;
    z-index: 100;
  }

  #startOverlay h2{
    font-family:'Poppins', sans-serif;
    font-size: 24px;
    color: var(--gold);
    margin:0;
  }

  #startBtn{
    background: var(--gold);
    color: #2B1E05;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size: 16px;
    padding: 16px 34px;
    border-radius: 12px;
    border:none;
    cursor:pointer;
  }

  #startBtn:hover{ opacity:0.9; }

  /* question overlay */
  #overlay{
    position: fixed;
    inset: 0;
    background: rgba(8,10,15,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }

  #overlay.show{ display:flex; }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    padding: 36px 32px;
    text-align:center;
  }

  .qnum{
    font-family:'Poppins', sans-serif;
    color: var(--gold);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  .qtext{
    font-family: 'Noto Nastaliq Urdu', 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.9;
    margin-bottom: 30px;
  }

  .actions{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content:center;
  }

  button{
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px 20px;
    border-radius: 10px;
    border: none;
    cursor:pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  button:active{ transform: scale(0.97); }

  .btn-skip{
    background: var(--surface-hi);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-skip:hover{ border-color: var(--red); }

  .btn-lifeline{
    background: var(--teal);
    color: #072823;
  }

  .btn-lifeline:hover{ opacity: 0.88; }

  .btn-close{
    background: transparent;
    color: var(--text-dim);
    padding: 8px;
    font-size: 13px;
  }

  .btn-undo{
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 8px 14px;
    font-size: 13px;
  }

  .btn-undo:hover{ background: rgba(214,88,79,0.12); }

  .lifeline-note{
    margin-top: 18px;
    font-size: 13px;
    color: var(--teal);
    min-height: 18px;
  }
</style>
</head>

questions[49] = 'جب بنی اسرائیل سمندر کے کنارے پہنچے تو وہ ڈر گئے؟ حضرت موسیٰ علیہ السلام نے لاٹھی سے سمندر کا کیا کیا؟';
questions[50] = 'اگر اللہ ہر دل کا حال جانتا ہے، تو کیا وہ ان احساسات کو بھی جانتا ہے جو ہم ایک دوسرے کے سامنے ظاہر نہیں کر سکتے؟';
questions[51] = 'حضرت نوح علیہ السلام نے کشتی میں کیا چیزیں سوار کیں؟ طوفان آنے سے پہلے آسمان پر کیا نشانیاں تھیں؟';
questions[52] = 'کیا آپ نے کبھی اللہ تعالیٰ کو اپنے قریب اور ساتھ پایا؟ اپنا تجربہ بیان کریں۔';
questions[54] = 'الخالق کا مطلب کیا ہے؟';
questions[55] = 'اللہ ہمارے لیے کیسے عظیم ہے؟';
questions[57] = 'جب کوئی شخص ہم سے غلطی کرے یا ہمیں نقصان پہنچائے تو ہمیں اس کے ساتھ کس طرح پیش آنے کی ہدایت دی گئی ہے؟';
questions[58] = 'اللہ نے پہاڑ پر حضرت موسیٰ علیہ السلام کو اپنی نشانی دکھائی؟ فرعون کے جادوگروں کے مقابلے میں کیا کیا؟';
questions[60] = 'کیا آپ شیئر کر سکتے ہیں کہ ہم مختلف زبانوں میں ایک دوسرے کو سلام اور خوش آمدید کیسے کہتے ہیں؟';

// -------- STATE ----------
let openedCount = 0;
let skippedCount = 0;
let lifelineCount = 0;
let currentBox = null;
const boxState = {};       // 'done' | 'skipped'
const lifelineUsedOn = {}; // true if lifeline was used on this box at least once

// -------- AUDIO ----------
const bgIdle = document.getElementById('bgIdle');
const bgQuestion = document.getElementById('bgQuestion');

function startIdleLoop(){
  try{
    bgQuestion.pause();
    bgIdle.play();
  }catch(e){}
}

function startQuestionLoop(){
  try{
    bgIdle.pause();
    bgQuestion.currentTime = 0;
    bgQuestion.play();
  }catch(e){}
}

document.getElementById('startBtn').addEventListener('click', () => {
  startIdleLoop();
  document.getElementById('startOverlay').style.display = 'none';
});

// -------- BUILD GRID ----------
const grid = document.getElementById('grid');
for(let i=1;i<=60;i++){
  const box = document.createElement('div');
  box.className = 'box';
  box.textContent = i;
  box.dataset.num = i;
  box.addEventListener('click', () => openBox(i));
  grid.appendChild(box);
}

function refreshBox(num){
  const box = grid.querySelector('[data-num="' + num + '"]');
  if(!box) return;
  box.classList.remove('done','skipped');
  const existingBadge = box.querySelector('.lifeline-badge');
  if(existingBadge) existingBadge.remove();

  if(boxState[num] === 'done'){
    box.classList.add('done');
  } else if(boxState[num] === 'skipped'){
    box.classList.add('skipped');
  }
  if(lifelineUsedOn[num]){
    const badge = document.createElement('div');
    badge.className = 'lifeline-badge';
    badge.textContent = 'L';
    box.appendChild(badge);
  }
}

function updateStats(){
  document.getElementById('openedCount').textContent = openedCount;
  document.getElementById('skippedCount').textContent = skippedCount;
  document.getElementById('lifelineCount').textContent = lifelineCount;
}

// -------- OVERLAY LOGIC ----------
const overlay = document.getElementById('overlay');
const qnumEl = document.getElementById('qnum');
const qtextEl = document.getElementById('qtext');
const lifelineBtn = document.getElementById('lifelineBtn');
const lifelineNote = document.getElementById('lifelineNote');
const statusNote = document.getElementById('statusNote');
const undoBtn = document.getElementById('undoBtn');

function openBox(num){
  startQuestionLoop();

  currentBox = num;
  qnumEl.textContent = 'QUESTION ' + num;
  qtextEl.textContent = questions[num];
  lifelineNote.textContent = '';

  if(boxState[num] === 'done'){
    statusNote.textContent = 'This question was already marked answered.';
    statusNote.style.color = 'var(--red)';
    undoBtn.style.display = 'inline-block';
  } else if(boxState[num] === 'skipped'){
    statusNote.textContent = 'This question was already skipped.';
    statusNote.style.color = 'var(--red)';
    undoBtn.style.display = 'inline-block';
  } else {
    statusNote.textContent = '';
    undoBtn.style.display = 'none';
  }

  overlay.classList.add('show');
}

function closeOverlay(){
  overlay.classList.remove('show');
  currentBox = null;
  startIdleLoop();
}

document.getElementById('skipBtn').addEventListener('click', () => {
  if(currentBox){
    if(!boxState[currentBox]){
      openedCount++;
      skippedCount++;
    } else if(boxState[currentBox] === 'done'){
      skippedCount++;
    }
    boxState[currentBox] = 'skipped';
    refreshBox(currentBox);
    updateStats();
  }
  closeOverlay();
});

lifelineBtn.addEventListener('click', () => {
  lifelineCount++;
  if(currentBox){
    lifelineUsedOn[currentBox] = true;
    refreshBox(currentBox);
  }
  updateStats();
  lifelineNote.textContent = 'Teacher lifeline used — ask the teacher for help on this question.';
});

document.getElementById('closeBtn').addEventListener('click', () => {
  if(currentBox){
    if(!boxState[currentBox]){
      openedCount++;
    } else if(boxState[currentBox] === 'skipped'){
      skippedCount--;
    }
    boxState[currentBox] = 'done';
    refreshBox(currentBox);
    updateStats();
  }
  closeOverlay();
});

undoBtn.addEventListener('click', () => {
  if(currentBox){
    if(boxState[currentBox] === 'skipped'){
      skippedCount--;
    }
    if(boxState[currentBox]){
      openedCount--;
    }
    delete boxState[currentBox];
    delete lifelineUsedOn[currentBox];
    refreshBox(currentBox);
    updateStats();
  }
  closeOverlay();
});

updateStats();
</script>

</body>
</html>
